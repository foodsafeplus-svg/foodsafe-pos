name: Build & tests
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # Les runners ubuntu-latest fournissent déjà le SDK Android (ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: foodsafe-pos-debug-apk, path: app/build/outputs/apk/debug/app-debug.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures-ui, path: docs/captures }
